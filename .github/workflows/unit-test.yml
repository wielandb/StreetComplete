name: Gradle unit tests

on:
  push:
    branches:
      - "master"
      - "modified"
      - "codex/streetcomplete-v64"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v3

      - name: Run unit tests with Gradle
        run: ./gradlew :app:testAndroidHostTest

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug -Papp.streetcomplete.debug=true

      - name: Preserve debug APK
        uses: actions/upload-artifact@v4
        with:
          name: scee-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 14

      - name: Check release compilation and shrinking
        run: ./gradlew :androidApp:minifyReleaseWithR8 -Papp.streetcomplete.debug=false

      - name: Preserve host test and release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          path: |
            app/build/reports/tests/
            app/build/test-results/
            androidApp/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
