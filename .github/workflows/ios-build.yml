name: Build and test iOS

on:
  push:
    branches:
      - codex/streetcomplete-v64
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx2g
        -Dorg.gradle.workers.max=1
        -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx2g
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v3

      - name: Check native toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          chmod +x gradlew

      - name: Run shared tests on the iOS simulator
        id: native_tests
        run: ./gradlew :app:iosSimulatorArm64Test --console=plain

      - name: Build the Swift application and embedded Kotlin framework
        id: build_app
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build/derived-data \
            -resultBundlePath iosApp/build/ios-build.xcresult \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build
          tar -czf iosApp/build/SCEE-simulator.tar.gz \
            -C iosApp/build/derived-data/Build/Products/Debug-iphonesimulator SCEE.app

      - name: Verify the application launches on the iOS simulator
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        run: bash .github/scripts/ios-smoke.sh

      - name: Exercise onboarding, SCEE settings and map actions
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        run: bash .github/scripts/ios-ui-smoke.sh

      - name: Preserve the simulator application
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: iosApp/build/SCEE-simulator.tar.gz
          retention-days: 14

      - name: Preserve native test and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verification
          path: |
            app/build/reports/tests/iosSimulatorArm64Test/
            app/build/test-results/iosSimulatorArm64Test/
            iosApp/build/ios-build.xcresult/
            iosApp/build/smoke/
          if-no-files-found: ignore
          retention-days: 14
