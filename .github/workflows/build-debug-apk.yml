name: Build debug apk

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set env
        run: echo "COMMIT_SHA=$(git log -n 1 --format='%h')" >> $GITHUB_ENV

      - name: Encode git revision
        run: |
          sed -i -e "s/val appVersionName = \"\([^ ]*\).*\"/val appVersionName = \"\1 (git $COMMIT_SHA)\"/" app/build.gradle.kts
          sed -i -e "s/versionName = \"\([^ ]*\).*\"/versionName = \"\1 (git $COMMIT_SHA)\"/" androidApp/build.gradle.kts

      - name: Build with Gradle
        run: ./gradlew :androidApp:assembleDebug -Papp.streetcomplete.debug=true

      - name: Rename APK
        run: mv androidApp/build/outputs/apk/debug/androidApp-debug.apk androidApp/build/outputs/apk/debug/SCEE-debug-$COMMIT_SHA.apk

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: SCEE-debug-apk-${{ env.COMMIT_SHA }}
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30
